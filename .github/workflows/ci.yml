name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schoolchan/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: schoolchan/backend/build/reports/tests/test
          retention-days: 7

  sidecar:
    name: Moderation sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schoolchan/ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  migrations:
    name: Flyway migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolchan
          POSTGRES_PASSWORD: schoolchan
          POSTGRES_DB: schoolchan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the app against PostgreSQL
        working-directory: schoolchan/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/schoolchan
          SPRING_DATASOURCE_USERNAME: schoolchan
          SPRING_DATASOURCE_PASSWORD: schoolchan
        run: ./gradlew bootRun --args='--spring.profiles.active=dev' &
        env_continue: true

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not start"
          exit 1

      - name: Check the board rendered
        run: curl -sf http://localhost:8080/ | grep -q "SchoolChan"
