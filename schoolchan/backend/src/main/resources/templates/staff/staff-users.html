<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <title>Staff users — SchoolChan</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
    <script th:src="@{/js/board.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/chrome :: staffbar}"></header>
<main>
    <h1>Staff users</h1>
    <form th:action="@{/staff/staff-users/create}" method="post" class="composer">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Username <input name="username" required/></label>
        <label>Password <input name="password" type="password" required/></label>
        <label>Role
            <select name="role">
                <option value="MODERATOR">Moderator</option>
                <option value="ADMIN">Admin</option>
            </select>
        </label>
        <button type="submit">Create</button>
    </form>
    <table class="thread-table">
        <thead><tr><th>Username</th><th>Role</th><th>Enabled</th><th>Action</th></tr></thead>
        <tbody>
        <tr th:each="u : ${staffUsers}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.role}"></td>
            <td th:text="${u.enabled}"></td>
            <td>
                <form th:action="@{/staff/staff-users/{id}/toggle(id=${u.id})}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="linkish" th:text="${u.enabled} ? 'Disable' : 'Enable'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/chrome :: foot}"></footer>
</body>
</html>
