<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <title>Moderator accountability — SchoolChan staff</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
    <script th:src="@{/js/board.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/chrome :: staffbar}"></header>
<main>
    <h1>Moderator accountability</h1>
    <p class="hint">What each staff member has done on this board. Moderators are
        anonymous to students, but not to each other.</p>
    <p class="hint" th:if="${#lists.isEmpty(byStaff)}">No staff actions recorded yet.</p>
    <div th:each="entry : ${byStaff}" class="post">
        <header><strong th:text="${entry.key}">staff</strong></header>
        <table class="thread-table">
            <thead><tr><th>Action</th><th>Times</th></tr></thead>
            <tbody>
            <tr th:each="a : ${entry.value}">
                <td th:text="${a.key}">action</td>
                <td th:text="${a.value}">0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/chrome :: foot}"></footer>
</body>
</html>
