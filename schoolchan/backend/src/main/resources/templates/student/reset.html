<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <title>Reset your password — SchoolChan</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
    <script th:src="@{/js/board.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/chrome :: bar}"></header>
<main>
    <h1>Reset your password</h1>
    <p class="hint">Ask a member of staff for a one-time code, then set a new password here.</p>
    <p class="notice" th:if="${error}" th:text="${error}"></p>
    <p class="notice" th:if="${ok}" th:text="${ok}"></p>
    <form class="composer" th:action="@{/student/reset}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Student ID number
            <input type="text" name="studentId" required placeholder="2024-12345"/>
        </label>
        <label>Reset code
            <input type="text" name="code" required maxlength="32" placeholder="the code staff gave you"/>
        </label>
        <label>New password
            <input type="password" name="newPassword" required minlength="8" autocomplete="new-password"/>
        </label>
        <button type="submit">Set new password</button>
    </form>
</main>
<footer th:replace="~{fragments/chrome :: foot}"></footer>
</body>
</html>
