<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <title th:text="${pageTitle}">Change your password</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
    <script th:src="@{/js/board.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/chrome :: bar}"></header>
<div th:replace="~{fragments/chrome :: studentribbon}"></div>
<main>
    <h1>Change your password</h1>
    <p class="notice" th:if="${error}" th:text="${error}"></p>
    <p class="notice" th:if="${ok}" th:text="${ok}"></p>
    <form class="composer" th:action="@{/student/password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Current password
            <input type="password" name="currentPassword" required autocomplete="current-password"/>
        </label>
        <label>New password
            <input type="password" name="newPassword" required minlength="8" autocomplete="new-password"/>
        </label>
        <label>Confirm new password
            <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"/>
        </label>
        <button type="submit">Change password</button>
    </form>
</main>
<footer th:replace="~{fragments/chrome :: foot}"></footer>
</body>
</html>
