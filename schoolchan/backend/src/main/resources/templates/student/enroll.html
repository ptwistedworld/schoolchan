<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}"/>
    <title th:text="${pageTitle}">Onboard a new student</title>
    <link rel="stylesheet" th:href="@{/css/board.css}"/>
    <script th:src="@{/js/board.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/chrome :: bar}"></header>
<main>
    <h1>Onboard a new student</h1>
    <p class="hint">If a classmate has just enrolled, submit their student ID number here.
        Staff review the request and provision the account.</p>
    <p class="notice" th:if="${error}" th:text="${error}"></p>
    <p class="notice" th:if="${ok}" th:text="${ok}"></p>
    <form class="composer" th:action="@{/student/enroll}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Student ID number
            <input type="text" name="studentId" required placeholder="2024-12345"/>
        </label>
        <label>Name (optional) <input type="text" name="displayName" maxlength="100"/></label>
        <label>Grade and section (optional) <input type="text" name="gradeSection" maxlength="64" placeholder="11 - Rizal"/></label>
        <button type="submit">Submit for approval</button>
    </form>

    <h2>Your requests</h2>
    <p class="hint" th:if="${#lists.isEmpty(requests)}">No requests yet.</p>
    <table class="thread-table" th:if="${!#lists.isEmpty(requests)}">
        <thead><tr><th>Student ID</th><th>Name</th><th>Status</th><th>When</th></tr></thead>
        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.studentId}">id</td>
            <td th:text="${r.displayName} ?: '—'">name</td>
            <td th:text="${r.status}">status</td>
            <td th:text="${#temporals.format(r.createdAt, 'MMM d, HH:mm')}">when</td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/chrome :: foot}"></footer>
</body>
</html>
